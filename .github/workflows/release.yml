# Builds the downloadable apps from this repository's source and attaches them
# to a draft GitHub Release. Trigger it by pushing a version tag:
#   git tag v1.0.0 && git push origin v1.0.0
# Running it by hand (Actions → release → Run workflow) builds everything
# without making a release; the files are kept as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Release files are named QidiStudioCalibration-<version>-<suffix>.
        include:
          - os: windows-latest
            suffix: windows.exe
          - os: macos-latest
            suffix: macos.zip
          - os: ubuntu-latest
            suffix: linux.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write      # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version and file name
        shell: bash
        run: |
          v=$(python -c "import qidi_studio_calibration as q; print(q.__version__)")
          if [[ "$GITHUB_REF" == refs/tags/* && "v$v" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ = $v in qidi_studio_calibration.py"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "ASSET=QidiStudioCalibration-$v-${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Tkinter is available to bundle
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build
        run: |
          python -m pip install pyinstaller==6.22.3
          pyinstaller --noconfirm qidi_studio_calibration.spec

      - name: Smoke test the build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) bin=dist/QidiStudioCalibration.exe ;;
            macOS)   bin=dist/QidiStudioCalibration.app/Contents/MacOS/QidiStudioCalibration ;;
            *)       bin=dist/QidiStudioCalibration ;;
          esac
          "$bin" --version | tee version.txt
          grep -qF "$VERSION" version.txt
          # Can the built app reach GitHub for updates? Only a warning: GitHub limits these requests.
          "$bin" --check-update || echo "::warning::$RUNNER_OS build couldn't check for updates"
          if [ "$RUNNER_OS" = Windows ]; then
            # The version is also in the EXE's properties (Properties → Details).
            powershell -NoProfile -Command "(Get-Item '$bin').VersionInfo.ProductVersion" | tee file_version.txt
            grep -qxF "$VERSION" <(tr -d '\r' < file_version.txt)
          fi
          "$bin" --qidi-dir tests/fixtures/QIDIStudio -o smoke.3mf
          python -c "import zipfile; z = zipfile.ZipFile('smoke.3mf'); assert 'Metadata/custom_gcode_per_layer.xml' in z.namelist(); print('3MF ok')"

      - name: Package
        shell: bash
        run: |
          cd dist
          case "$RUNNER_OS" in
            Windows) mv QidiStudioCalibration.exe "$ASSET" ;;
            macOS)   ditto -c -k --keepParent QidiStudioCalibration.app "$ASSET" ;;
            *)       tar -czf "$ASSET" QidiStudioCalibration ;;
          esac

      - name: Record build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ env.ASSET }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true   # review the notes, then press Publish on the Releases page
          generate_release_notes: true
          files: release/*
